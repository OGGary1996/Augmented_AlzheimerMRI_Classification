worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream clinical_api {
        server 127.0.0.1:8000;
    }

    upstream chatbot_api {
        server 127.0.0.1:8001;
    }

    server {
        listen 7860;
        server_name _;

        root /app/alzheimerMRI_frontend/dist;
        index index.html;

        location /predict/ {
            proxy_pass http://clinical_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /chatbot {
            proxy_pass http://chatbot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/health/main {
            proxy_pass http://clinical_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /api/health/chatbot {
            proxy_pass http://chatbot_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
