services:
  - type: web
    name: alzheimer-api
    runtime: python
    plan: free
    buildCommand: cd FastAPIServer && pip install -r requirements.txt
    startCommand: cd FastAPIServer && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.15"
      - key: ALLOWED_ORIGINS
        value: "*"
