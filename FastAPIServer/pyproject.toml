[project]
name = "augmented-alzheimer-fastapi-server"
version = "0.1.0"
description = "Standalone FastAPI backend for the Alzheimer MRI project."
requires-python = "==3.10.15"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    "python-multipart==0.0.22",
    "pydantic==2.12.5",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "pillow==12.1.0",
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "joblib==1.5.3",
    "tensorflow==2.20.0",
    "langchain==1.2.12",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.3",
    "langchain-huggingface==1.2.1",
    "langchain-text-splitters==1.1.1",
    "transformers==5.3.0",
    "sentence-transformers==5.3.0",
    "faiss-cpu==1.13.2",
    "pypdf==6.9.0",
    "python-dotenv==1.2.2",
]

[tool.uv]
package = false
